<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- MIDI Piano icon: four piano keys (C to F) on the app's dark blue background, with the E key pressed in
       the app's periwinkle accent and three sound waves rising from it. Drawn by hand as plain shapes. Everything
       sits inside the maskable safe zone (a circle of 40 % radius), so the same picture is used for the
       maskable icon. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="0%" r="100%">
      <stop offset="0" stop-color="#252d41" />
      <stop offset=".58" stop-color="#10131b" />
      <stop offset="1" stop-color="#0b0d13" />
    </radialGradient>
    <linearGradient id="ivory" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#e7eaf1" />
    </linearGradient>
    <linearGradient id="pressed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cbd5ff" />
      <stop offset="1" stop-color="#a7b9ff" />
    </linearGradient>
    <linearGradient id="ebony" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#333b4d" />
      <stop offset=".7" stop-color="#080a0f" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity=".5" />
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)" />

  <!-- sound waves above the pressed key -->
  <g fill="none" stroke="#a7b9ff" stroke-linecap="round" stroke-width="22">
    <path d="M 520 300 Q 567 270 614 300" opacity=".95" />
    <path d="M 492 254 Q 567 208 642 254" opacity=".7" />
    <path d="M 464 208 Q 567 146 670 208" opacity=".45" />
  </g>

  <g filter="url(#shadow)">
    <!-- white keys C D E F; E is pressed -->
    <g stroke="#0b0d13" stroke-width="8">
      <rect x="292" y="352" width="110" height="400" rx="14" fill="url(#ivory)" />
      <rect x="402" y="352" width="110" height="400" rx="14" fill="url(#ivory)" />
      <rect x="512" y="352" width="110" height="400" rx="14" fill="url(#pressed)" />
      <rect x="622" y="352" width="110" height="400" rx="14" fill="url(#ivory)" />
    </g>
    <!-- black keys C♯ D♯ -->
    <g fill="url(#ebony)" stroke="#050609" stroke-width="6">
      <rect x="364" y="348" width="76" height="240" rx="10" />
      <rect x="474" y="348" width="76" height="240" rx="10" />
    </g>
  </g>
</svg>
